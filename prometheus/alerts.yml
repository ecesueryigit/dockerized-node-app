groups:
  - name: node-app-alerts
    rules:
      - alert: NodeAppDown
        expr: up{job="node-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node.js application is down"
          description: "Prometheus cannot reach the node-app target."

      - alert: NodeAppHighCPU
        expr: |
          rate(container_cpu_usage_seconds_total{container="devops-node-app"}[5m]) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Node.js container CPU usage is high"
          description: "The CPU usage of devops-node-app has been above 80% for 2 minutes."

      - alert: NodeAppHighMemory
        expr: |
          container_memory_usage_bytes{container="devops-node-app"} / 1024 / 1024 > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Node.js container memory usage is high"
          description: "The memory usage of devops-node-app has been above 500 MB for 2 minutes."