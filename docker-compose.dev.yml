services:

  node-app:
    container_name: devops-node-app

    build:
        context: ./app
        dockerfile: Dockerfile.dev

    ports:
        - "3000:3000"

    volumes:
        - ./app:/app
        - /app/node_modules
        

    env_file:
        - .env
        
    depends_on:
      - mongo

    command: npm run dev

  mongo:
    image: mongo:7
    container_name: mongo-db
    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - node-app

volumes:
  mongo-data:

      
