 services:
  
    node-app:
      container_name: devops-node-app-prod

      build:
        context: ./app
        dockerfile: Dockerfile

      ports:
        - "3000:3000"


      env_file:
        - .env

      environment:
        - MONGO_URL=mongodb://mongo:27017/todos

      depends_on:
        - mongo
        
      command: npm start

    mongo:
      image: mongo:7
      container_name: mongo-db
      restart: always

      ports:
        - "27017:27017"

      volumes:
        - mongo-data:/data/db

    nginx:
      image: nginx:alpine
      container_name: nginx-proxy
      ports:
        - "80:80"
      volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf:ro
      depends_on:
        - node-app

 volumes:
   mongo-data: