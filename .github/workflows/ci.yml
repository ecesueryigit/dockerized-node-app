      
name: Node.js Docker CI/CD

on: 
  push: 
     branches: [main, dev]

     tags:
       - 'v*'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    

jobs:

  # ===========================
  # 1. TEST STAGE
  # ===========================
  test:
    runs-on: ubuntu-latest

    steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: Setup Node.js with cache
         uses: actions/setup-node@v3
         with:
            node-version: 18
            cache: 'npm'
            cache-dependency-path: app/package-lock.json

       - name: Install dependencies
         run: npm ci
         working-directory: ./app

       - name: Run test
         run: npm test
         working-directory: ./app
         
         
  # ============================
  # 2. BUILD STAGE
  # ============================
  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
       version: ${{ steps.vars.outputs.VERSION }}

    steps:
       - name: Checkout code
         uses: actions/checkout@v4
         
       - name: Debug ref info
         run: |
          echo "ref: $GITHUB_REF"
          echo "ref_name: $GITHUB_REF_NAME"
       
       - name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v3

       - name: Log in to Docker Hub
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}

       - name: Extract version
         id: vars
         run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          fi
         

       - name: Build Dev image
         if: github.ref == 'refs/heads/dev'
         run: |
           docker build \
             -t ecesueryigit/dockerized-node-app:dev \
             -t ecesueryigit/dockerized-node-app:${{ github.sha }} \
             ./app

       - name: Build Prod image
         if: github.ref == 'refs/heads/main'
         run: |
           docker build \
             -t ecesueryigit/dockerized-node-app:main \
             -t ecesueryigit/dockerized-node-app:latest \
             -t ecesueryigit/dockerized-node-app:${{ github.sha }} \
             ./app

       - name: Build Release image
         if: startsWith(github.ref, 'refs/tags/')
         run: |
            docker build -t ecesueryigit/dockerized-node-app:${{ steps.vars.outputs.VERSION }} ./app
            
# ========================
# 3. SECURITY STAGE
# ========================
  security:
    needs: build
    runs-on: ubuntu-latest

    steps:
          - name: Checkout code
            uses: actions/checkout@v4
      
          - name: Trivy scan (dev - non blocking)
            if: github.ref == 'refs/heads/dev'
            uses: aquasecurity/trivy-action@v0.36.0
            with:
              image-ref: ecesueryigit/dockerized-node-app:${{ github.sha }}
              format: table
              severity: CRITICAL,HIGH
              exit-code: 0
      
          - name: Trivy scan (prod - blocking)
            if: github.ref == 'refs/heads/main'
            uses: aquasecurity/trivy-action@v0.36.0
            with:
              image-ref: ecesueryigit/dockerized-node-app:${{ github.sha }}
              format: table
              severity: CRITICAL,HIGH
              args: --ignore-unfixed --exit-code 1
      
          - name: Trivy scan (release - blocking)
            if: startsWith(github.ref, 'refs/tags/')
            uses: aquasecurity/trivy-action@v0.36.0
            with:
              image-ref: ecesueryigit/dockerized-node-app:${{ steps.vars.outputs.VERSION }}
              format: table
              severity: CRITICAL,HIGH
              args: --ignore-unfixed --exit-code 1

# ==========================
# 4. PUSH STAGE
# ==========================
  push:
    needs: security 
    runs-on: ubuntu-latest

    steps:
           - name: Log in to Docker Hub
             uses: docker/login-action@v3
             with:
               username: ${{ secrets.DOCKERHUB_USERNAME }}
               password: ${{ secrets.DOCKERHUB_TOKEN }}
      
           - name: Push Dev image
             if: github.ref == 'refs/heads/dev'
             run: |
                docker push ecesueryigit/dockerized-node-app:dev 
                docker push ecesueryigit/dockerized-node-app:${{ github.sha }}
      
           - name: Push Prod image
             if: github.ref == 'refs/heads/main'
             run: |
                  docker push ecesueryigit/dockerized-node-app:latest 
                  docker push ecesueryigit/dockerized-node-app:main 
                  docker push ecesueryigit/dockerized-node-app:${{ github.sha }}
      
           - name: Push Release image
             if: startsWith(github.ref, 'refs/tags/')
             run: |
                  docker push ecesueryigit/dockerized-node-app:${{ steps.vars.outputs.VERSION }}

     
    
        

    
    


      

        

       

       
        
       





                    
                  
                
        
