      
name: Node.js Docker CI/CD

on: 
  push: 
     branches: [main, dev]

     tags:
       - 'v*'
  workflow_dispatch:
    

jobs:
  build-and-push:
     runs-on: ubuntu-latest

     steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: Debug ref info
         run: |
          echo "ref: $GITHUB_REF"
          echo "ref_name: $GITHUB_REF_NAME"

       - name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v3
           
       - name: Setup Node.js with cache
         uses: actions/setup-node@v3
         with:
            node-version: 18
            cache: 'npm'
            cache-dependency-path: app/package-lock.json


       - name: Install dependencies
         run: npm ci
         working-directory: ./app

       - name: Run test
         run: npm test
         working-directory: ./app

       - name: Log in to Docker Hub
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}

       - name: Extract version
         id: vars
         if: startsWith(github.ref, 'refs/tags/')
         run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
         
       - name: Build Dev image
         if: github.ref == 'refs/heads/dev'
         run: |
           docker build \
             -t ecesueryigit/dockerized-node-app:dev \
             -t ecesueryigit/dockerized-node-app:${{ github.sha }} \
             ./app
                

       - name: Trivy scan (dev - non blocking)
         if: github.ref == 'refs/heads/dev'
         uses: aquasecurity/trivy-action@v0.36.0
         with:
            image-ref: ecesueryigit/dockerized-node-app:${{ github.sha }}
            format: table
            severity: CRITICAL,HIGH
            exit-code: 0

       - name: Push Dev image
         if: github.ref == 'refs/heads/dev'
         run: |
          docker push ecesueryigit/dockerized-node-app:dev 
          docker push ecesueryigit/dockerized-node-app:${{ github.sha }}

       - name: Build Prod image
         if: github.ref == 'refs/heads/main'
         run: |
           docker build \
             -t ecesueryigit/dockerized-node-app:main \
             -t ecesueryigit/dockerized-node-app:latest \
             -t ecesueryigit/dockerized-node-app:${{ github.sha }} \
             ./app
           

       - name: Trivy scan (prod - blocking)
         if: github.ref == 'refs/heads/main'
         uses: aquasecurity/trivy-action@v0.36.0
         with:
          image-ref: ecesueryigit/dockerized-node-app:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

       - name: Push Prod image
         if: github.ref == 'refs/heads/main'
         run: |
            docker push ecesueryigit/dockerized-node-app:latest 
            docker push ecesueryigit/dockerized-node-app:main 
            docker push ecesueryigit/dockerized-node-app:${{ github.sha }}

       - name: Build Release image
         if: startsWith(github.ref, 'refs/tags/')
         run: |
            docker build -t ecesueryigit/dockerized-node-app:${{ steps.vars.outputs.VERSION }} ./app

       - name: Trivy scan (release - blocking)
         if: startsWith(github.ref, 'refs/tags/')
         uses: aquasecurity/trivy-action@v0.36.0
         with:
          image-ref: ecesueryigit/dockerized-node-app:${{ steps.vars.outputs.VERSION }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

       - name: Push Release image
         if: startsWith(github.ref, 'refs/tags/')
         run: |
            docker push ecesueryigit/dockerized-node-app:${{ steps.vars.outputs.VERSION }}
                    
                  
                
        
