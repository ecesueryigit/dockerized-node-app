      
name: Node.js Docker CI/CD

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:



jobs:

  # ===========================
  # 1. TEST STAGE
  # ===========================
  test:
    runs-on: ubuntu-latest

    steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: Setup Node.js with cache
         uses: actions/setup-node@v3
         with:
            node-version: 18
            cache: 'npm'
            cache-dependency-path: app/package-lock.json

       - name: Install dependencies
         run: npm ci
         working-directory: ./app
         
       - name: Check node_modules
         run: ls node_modules/.bin
         working-directory: ./app

       - name: Lint (fail test)
         run: npm run lint
         working-directory: ./app

       - name: Create env file
         run: |
           echo "MONGO_URL=mongodb://mongo:27017/todosdb" > .env
           echo "PORT=3000" >> .env
           echo "NODE_ENV=development" >> .env
      
       - name: Check env file
         run: cat .env

       - name: Start services
         run: docker compose -f docker-compose.dev.yml up -d
         

       - name: Check container env
         run: docker exec devops-node-app env | grep MONGO

       - name: Wait for Mongo
         run: sleep 10

       - name: Run integration test
         run: docker exec devops-node-app npm test
         

       - name: Stop services
         if: always()
         run: docker compose -f docker-compose.dev.yml down
                
         
  # ============================
  # 2. BUILD + SECURITY + PUSH STAGE
  # ============================

  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
       version: ${{ steps.vars.outputs.VERSION }}

    steps:
       - name: Checkout code
         uses: actions/checkout@v4
         
       - name: Debug ref info
         run: |
          echo "ref: $GITHUB_REF"
          echo "ref_name: $GITHUB_REF_NAME"
       
       - name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v3

       - name: Log in to Docker Hub
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}

       - name: Extract version
         id: vars
         run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          fi
         

       - name: Build Dev image
         if: github.ref == 'refs/heads/dev'
         run: |
           docker build \
             -t ecesueryigit/dockerized-node-app:dev \
             -t ecesueryigit/dockerized-node-app:${{ github.sha }} \
             ./app

       - name: Build Prod image
         if: github.ref == 'refs/heads/main'
         run: |
           docker build \
             -t ecesueryigit/dockerized-node-app:main \
             -t ecesueryigit/dockerized-node-app:latest \
             -t ecesueryigit/dockerized-node-app:${{ github.sha }} \
             ./app

       - name: Build Release image
         if: startsWith(github.ref, 'refs/tags/')
         run: |
            docker build -t ecesueryigit/dockerized-node-app:${{ steps.vars.outputs.VERSION }} ./app

       - name: Create env file
         run: |
          echo "MONGO_URL=mongodb://mongo:27017/todosdb" > .env
          echo "PORT=3000" >> .env
          echo "NODE_ENV=development" >> .env

       - name: Start services
         run: docker compose -f docker-compose.dev.yml up -d
         env:
           MONGO_URL: mongodb://mongo:27017/todosdb

       - name: Check containers
         run: docker ps

         
       - name: API health check
         run: |
            for i in {1..10}; do
              curl --fail http://localhost:3000/health && exit 0
              sleep 5
            done
            docker logs devops-node-app
            exit 1
           

       - name: Stop services
         if: always()
         run: docker compose -f docker-compose.dev.yml down



       - name: Trivy scan (dev - non blocking)
         if: github.ref == 'refs/heads/dev'
         uses: aquasecurity/trivy-action@v0.36.0
         with:
           image-ref: ecesueryigit/dockerized-node-app:dev
           format: table
           severity: CRITICAL,HIGH
           exit-code: 0
      
       - name: Trivy scan (prod - blocking)
         if: github.ref == 'refs/heads/main'
         uses: aquasecurity/trivy-action@v0.36.0
         with:
           image-ref: ecesueryigit/dockerized-node-app:latest
           format: table
           severity: CRITICAL
           ignore-unfixed: true
           exit-code: 1
              
      
       - name: Trivy scan (release - blocking)
         if: startsWith(github.ref, 'refs/tags/')
         uses: aquasecurity/trivy-action@v0.36.0
         with:
           image-ref: ecesueryigit/dockerized-node-app:${{ steps.vars.outputs.VERSION }}
           format: table
           severity: CRITICAL,HIGH
           ignore-unfixed: true
           exit-code: 1

       - name: Push Dev image
         if: github.ref == 'refs/heads/dev'
         run: |
                docker push ecesueryigit/dockerized-node-app:dev 
                docker push ecesueryigit/dockerized-node-app:${{ github.sha }}
      
       - name: Push Prod image
         if: github.ref == 'refs/heads/main'
         run: |
                  docker push ecesueryigit/dockerized-node-app:latest 
                  docker push ecesueryigit/dockerized-node-app:main 
                  docker push ecesueryigit/dockerized-node-app:${{ github.sha }}
      
       - name: Push Release image
         if: startsWith(github.ref, 'refs/tags/')
         run: |
                  docker push ecesueryigit/dockerized-node-app:${{ steps.vars.outputs.VERSION }}

  ###################
  # 3. DEPLOY STAGE
  ###################S    

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/dockerized-node-app
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
      
            



     
    
        

    
    


      

        

       

       
        
       





                    
                  
                
        
