
name: Node.js Docker CI/CD

on: 
  push: 
     branches: [main, dev]

     tags:
       - 'v*'
  workflow_dispatch:
    

jobs:
  build-and-push:
     runs-on: ubuntu-latest

     steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: Debug ref info
         run: |
          echo "ref: $GITHUB_REF"
          echo "ref_name: $GITHUB_REF_NAME"

       - name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v3
           
       - name: Setup Node.js with cache
         uses: actions/setup-node@v3
         with:
            node-version: 18
            cache: 'npm'
            cache-dependency-path: app/package-lock.json


       - name: Install dependencies
         run: npm ci
         working-directory: ./app

       - name: Run test
         run: npm test
         working-directory: ./app

       - name: Log in to Docker Hub
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}

       - name: Extract version
         id: vars
         if: startsWith(github.ref, 'refs/tags/')
         run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
         
       - name: Build and Push Dev image (dev)
         if: github.ref == 'refs/heads/dev'
         uses: docker/build-push-action@v5
         with:
            context: ./app
            push: true
            platforms: linux/amd64
            tags: |
              ecesueryigit/dockerized-node-app:dev
              ecesueryigit/dockerized-node-app:${{ github.sha }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

       - name: Build and Push Prod image (main)
         if: github.ref == 'refs/heads/main'
         uses: docker/build-push-action@v5
         with:
           context: ./app
           push: true
           platforms: linux/amd64
           tags: |
                ecesueryigit/dockerized-node-app:latest
                ecesueryigit/dockerized-node-app:main
                ecesueryigit/dockerized-node-app:${{ github.sha }}
           cache-from: type=gha
           cache-to: type=gha,mode=max

       - name: Build and Push Release image 
         if: "startsWith(github.ref, 'refs/tags/')"
         uses: docker/build-push-action@v5
         with:
           context: ./app
           push: true
           platforms: linux/amd64
           tags: |
                ecesueryigit/dockerized-node-app:latest
                ecesueryigit/dockerized-node-app:${{ steps.vars.outputs.VERSION }}
           cache-from: type=gha
           cache-to: type=gha,mode=max
            
                  
                
        
